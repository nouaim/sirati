# Synced to GitHub by .github/workflows/sync-labels.yaml, which needs the
# `issues: write` permission the workflow now declares.
# Warning
- color: "ee0701"
  description: "Categorize bug reports."
  name: ":warning: bug"
- color: "ee0701"
  description: "Categorize vulnerability reports."
  name: ":warning: vulnerability"

# Highlight
- color: "0e8a16"
  description: "Good for newcomers."
  name: ":fire: good first issue"
- color: "0e8a16"
  description: "Extra attention is needed."
  name: ":fire: help wanted"

# Cancel
- color: "b60205"
  description: "This issue or pull request already exists."
  name: ":pray: duplicate"
- color: "b60205"
  description: "This will not be worked on."
  name: ":pray: wontfix"

# Size
- color: "cfd3d7"
  description: "Extra Small size issue or PR."
  name: "size/XS"
- color: "cfd3d7"
  description: "Small size issue or PR."
  name: "size/S"
- color: "cfd3d7"
  description: "Medium size issue or PR."
  name: "size/M"
- color: "cfd3d7"
  description: "Large size issue or PR."
  name: "size/L"
- color: "cfd3d7"
  description: "Extra Large size issue or PR."
  name: "size/XL"

# Content
- color: "1d76db"
  description: "Changes to the LaTeX examples."
  name: "latex"
- color: "1d76db"
  description: "Changes to the continuous integration configuration."
  name: "ci"
- color: "1d76db"
  description: "Changes to the documentation."
  name: "docs"

# Platform
# The documented installation is Linux, which is what was tested.  These mark the
# platforms still waiting for someone to run the installer and report back.
- color: "5319e7"
  description: "macOS: install.sh and the documents have not been run on a Mac."
  name: ":apple: macOS"
- color: "5319e7"
  description: "Windows: WSL2 and the Docker path have not been run on Windows."
  name: ":window: windows"
