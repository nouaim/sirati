name: Compile PDFs

on:
  push: {}
  pull_request: {}

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install fonts
      run: |
        apt update
        apt install --yes fonts-roboto
        # Tajawal has no Debian/Ubuntu package, so fetch it from upstream Google
        # Fonts (SIL OFL 1.1) and install it into the image's font path.  The
        # image already ships everything else the documents need: polyglossia
        # and fontawesome7 come with TeX Live 2026.
        base=https://raw.githubusercontent.com/google/fonts/main/ofl/tajawal
        mkdir -p /usr/share/fonts/truetype/tajawal
        for f in Tajawal-Regular.ttf Tajawal-Bold.ttf Tajawal-Medium.ttf; do
          curl -fsSL -o "/usr/share/fonts/truetype/tajawal/$f" "$base/$f"
        done
        fc-cache -f

    - name: Verify fonts
      run: |
        # fc-match silently substitutes a fallback when a family is absent, so
        # assert the family actually resolved.
        fc-match Tajawal
        fc-match Roboto
        fc-match Tajawal | grep -qi tajawal

    - name: Compile
      run: make

    - uses: actions/upload-artifact@v7
      with:
        name: examples
        path: examples/*.pdf

  docker:
    # The second documented installation path: build the image the README tells
    # readers to build, then compile and test inside it, exactly as documented.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Build the documented image
      run: docker build -t sirati .

    - name: Compile inside the image
      run: |
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/doc -w /doc sirati make
        ls -l examples/*.pdf

    - name: Run the test suite inside the image
      run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/doc -w /doc sirati tests/check-arabic-examples.sh

  install:
    # And the first documented path: run install.sh on a clean machine, then
    # build and test with what it produced.  This is the reader who has no TeX.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install on a clean Ubuntu, then build and test
      run: |
        docker run --rm -v "$PWD":/src -w /src ubuntu:latest sh -c '
          set -e
          ./install.sh
          git config --global --add safe.directory /src
          make
          tests/check-arabic-examples.sh
        '
